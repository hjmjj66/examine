armor_controller_node:
  ros__parameters:
    front_0_target_states_topic: /aim_predictor/front_0/target_states
    front_1_target_states_topic: /aim_predictor/front_1/target_states
    back_target_states_topic: /aim_predictor/back/target_states
    outpost_state_topic: /aim_outpost_predictor/outpost_state
    selected_target_id_topic: /decider/selected_target_id
    aim_result_topic: /ly/aim/result
    gimbal_angles_topic: /ly/gimbal/angles
    bullet_speed_topic: /ly/game/bullet
    control_angles_topic: /ly/control/angles
    control_firecode_topic: /ly/control/firecode
    selected_armor_topic: /controller/selected_armor
    debug_target_point_topic: /armor_controller/debug/target_point_barrel
    debug_selected_armor_index_topic: /armor_controller/debug/selected_armor_index
    publish_legacy_control_topics: true
    # 手动开火模式：true 时不发布 /ly/control/firecode，交由外部手动控制开火
    manual_fire_mode: True
    publish_rate_hz: 100.0
    # 最大弹频（Hz），即每秒最多翻转几次 firecode
    fire_rate_hz: 2.0
    bullet_speed_mps: 23.0
    min_bullet_speed_mps: 20.0
    bullet_speed_alpha: 0.5
    tol_deltax_m: 0.05
    tol_deltay_m: 0.05
    bullet_mass_kg: 0.0032
    bullet_diameter_m: 0.0168
    max_iter: 100
    tol: 1.0e-6
    # 控制解算目标坐标系：在该系下解 yaw/pitch（建议为俯仰关节 gimbal_barrel_joint）
    barrel_joint_frame: gimbal_barrel_joint
    # TF 查询超时时间，设为 0 表示不等待，查不到立即 fallback
    target_tf_timeout_sec: 0.10
    # 目标消息超过该时长未更新则直接 fallback，避免使用陈旧时间戳反复查 TF
    target_msg_timeout_sec: 0.10
    armor_select_area_weight: 1.0
    armor_select_angle_weight: 0.0
    include_processing_delay: true
    system_response_time_sec: 0.0
    max_prediction_iterations: 10
    fly_time_converge_threshold_sec: 0.001
    max_processing_delay_sec: 0.2
    max_predict_time_sec: 1.0
    shoot_yaw_tolerance_deg: 1.0
    shoot_pitch_tolerance_deg: 1.0
    shoot_face_tolerance_deg: 2.0
    spin_center_aim_angular_velocity_threshold: 2.0

    # —— 智能选板参数（移植自 ly_aim controller）——
    # enable_smart_selector: true 时使用装甲板旋转方向和角速度动态选板
    # false 时 fallback 到最近距离选择
    enable_smart_selector: true
    # 到来角 (°)：装甲板朝向与 center_yaw 之差小于此角度才视为正面候选
    comming_angle_deg: 60.0
    # 离开角 (°)：装甲板正在转来时的角度阈值，更宽松以留出余量
    leaving_angle_deg: 20.0
    # 慢速旋转角速度阈值 (rad/s)：低于此值用"最正面选择"策略，高于此值用"正在转来"策略
    smart_selector_max_angular_velocity: 2.0
    outpost_shoot_yaw_gate_deg: 45.0

    # 与 ros2_ly_ws_sentry/src/predictor 内 Controller 一致：射击表、目标点偏置
    # shoot_table_adjust.enable: true 时在弹道解上叠加二阶补偿（与 predictor_config.yaml 同源系数）
    controller_config:
      shoot_table_adjust:
        enable: false
        pitch:
          intercept: -1.547
          coef_z: -4.876
          coef_d: 1.1344
          coef_z2: -16.5213
          coef_zd: -1.14337
          coef_d2: -0.1510
        yaw:
          intercept: 1.0714
          coef_z: -7.7968
          coef_d: -1.25504
          coef_z2: -15.632
          coef_zd: 0.1603
          coef_d2: 0.1827
      target_offset:
        x: 0.0
        y: 0.0
        z: 0.0
