/**:
  ros__parameters:
    # ---------- 前相机 #0(大恒工业相机) ----------
    front_armor_set_topic: "/aim_detector/front_0/armor_sets" # 前相机 0 装甲板检测输入
    front_armor_pose_set_topic: "/aim_solver/front_0/armor_pose_sets" # 前相机 0 位姿解算输出
    front_camera_info_topic: "/gx_camera_0/camera_info" # 前相机 0 运行时内参输入
    front_visualization_topic: "/aim_solver/front_0/visualization" # 前相机 0 可视化输出
    front_use_camera_info_topic: false # 是否用 CameraInfo 覆盖下方标定内参
    front_camera_matrix: [2594.8668197346, 0.0, 623.6194463792, # 3x3 相机内参矩阵，按行存储
                          0.0, 2593.9303479068, 487.9543574800,
                          0.0, 0.0, 1.0]
    front_distortion_coefficients: [0.0013295332, -0.3225360920, 0.0008215090, # 畸变系数 [k1,k2,p1,p2,k3]
                                   0.0001941072, 7.0936030151]

    # ---------- 前相机 #1(大恒工业相机) ----------
    front_1_armor_set_topic: "/aim_detector/front_1/armor_sets" # 前相机 1 装甲板检测输入
    front_1_armor_pose_set_topic: "/aim_solver/front_1/armor_pose_sets" # 前相机 1 位姿解算输出
    front_1_camera_info_topic: "/gx_camera_1/camera_info" # 前相机 1 运行时内参输入
    front_1_visualization_topic: "/aim_solver/front_1/visualization" # 前相机 1 可视化输出
    front_1_use_camera_info_topic: false # 是否用 CameraInfo 覆盖下方标定内参
    front_1_camera_matrix: [1543.5313225509, 0.0, 605.3761892974, # 3x3 相机内参矩阵，按行存储
                            0.0, 1543.6532647271, 492.7908483571,
                            0.0, 0.0, 1.0]
    front_1_distortion_coefficients: [-0.2065504948, 0.1520899445, 0.0002382891, # 畸变系数 [k1,k2,p1,p2,k3]
                                      0.0006906806, 0.0535836285]

    # ---------- 后相机(USB摄像头) ----------
    back_armor_set_topic: "/aim_detector/back/armor_sets" # 后相机装甲板检测输入
    back_armor_pose_set_topic: "/aim_solver/back/armor_pose_sets" # 后相机位姿解算输出
    back_camera_info_topic: "/usb_camera/camera_info" # 后相机运行时内参输入
    back_visualization_topic: "/aim_solver/back/visualization" # 后相机可视化输出
    back_use_camera_info_topic: false # 是否用 CameraInfo 覆盖下方标定内参
    back_camera_matrix: [549.8351599620, 0.0, 599.1912418111, # 3x3 相机内参矩阵，按行存储
                         0.0, 545.6222130545, 420.2722299780,
                         0.0, 0.0, 1.0]
    back_distortion_coefficients: [0.1255592953, -0.1963274373, -0.0012630831, # 畸变系数 [k1,k2,p1,p2,k3]
                                   -0.0034363489, 0.0630439860]

    # ---------- 共享参数 ----------
    target_frame: "gimbal_world" # 解算位姿转换并输出到的目标坐标系
    tf_lookup_timeout_sec: 0.01 # 查询目标坐标系 TF 的最长等待时间（秒）
    tf_timestamp_offset_sec: -0.244 # 基于图像时间查询 TF 时附加的时间偏移（秒）
    use_current_time_for_tf: false # true 时查询最新 TF，忽略图像时间戳与上述偏移
    enable_visualization: true # 是否发布装甲板位姿 Marker 可视化
    use_generic_mode: false # 是否使用 solvePnPGeneric 生成并筛选多个 PnP 解
    project_error_ratio_thres: 3.0 # 两个 PnP 解重投影误差比超过此值时丢弃结果
    roll_thres_degree: 15.0 # 解算装甲板滚转角超过此值时丢弃结果（度）
    outpost_is_small_armor: true # 前哨站使用小装甲板尺寸；false 时使用大装甲板尺寸
    enable_optimize_yaw: true # 是否在固定俯仰角约束下优化装甲板偏航角
    optimize_yaw_pitch_deg: 15.0 # 普通装甲板偏航优化采用的固定俯仰角（度）
    optimize_yaw_outpost_pitch_deg: -15.0 # 前哨站偏航优化采用的固定俯仰角（度）
