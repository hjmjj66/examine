gx_camera_node:
  ros__parameters:
    device_sn: "KE0200060396"
    device_index: 1
    frame_id: "gx_camera_0_optical_frame"
    image_topic: "/gx_camera_0/image_raw"
    camera_info_topic: "/gx_camera_0/camera_info"
    publish_rate: 200.0
    # GX device exposure timestamp -> ROS time mapping.
    use_device_timestamp: true
    timestamp_offset_sec: 0.0
    # Leave at 0.0: if the SDK does not expose the frequency, the driver
    # estimates it from two timestamp latch samples.
    timestamp_tick_frequency_hz_override: 0.0
    timestamp_status_topic: "/gx_camera_0/timestamp_status"
    timestamp_latch_period_sec: 0.25
    timestamp_latch_alpha: 0.25
    timestamp_latch_max_correction_sec: 0.02
    timestamp_frequency_estimation_interval_sec: 0.05

    width: 1280
    height: 1024

    gain: 12.0
    auto_gain_max: 12.0
    auto_gain_min: 2.0
    auto_gain: 0

    exposure_time: 2000.0
    auto_exposure_time_max: 10000.0
    auto_exposure_time_min: 1000.0
    auto_exposure: 0

    red_balance_ratio: 1.2000
    green_balance_ratio: 1.0
    blue_balance_ratio: 1.2800
    auto_balance_mode: "once"

    camera_fx: 2594.8668197346
    camera_fy: 2593.9303479068
    camera_cx: 623.6194463792
    camera_cy: 487.9543574800

    dist_k1: 0.0013295332
    dist_k2: -0.3225360920
    dist_p1: 0.0008215090
    dist_p2: 0.0001941072
    dist_k3: 7.0936030151
