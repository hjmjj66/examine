/**:
  ros__parameters:
    image_topic: "/gx_camera_1/image_raw" # 标定使用的图像话题
    debug_image_topic: "/aim_camera_intrinsic/debug_image" # 角点调试图像话题
    output_file: "" # 标定结果输出文件；空值按程序默认处理
    camera_name: "front_1" # 相机名称，用于生成结果键名
    frame_id: "gx_camera_1" # 相机坐标系名称
    distortion_model: "plumb_bob" # 畸变模型名称
    aim_solver_camera_matrix_key: "front_1_camera_matrix" # 写入解算器的内参键
    aim_solver_distortion_key: "front_1_distortion_coefficients" # 写入解算器的畸变键
    board_cols: 11 # 标定板列数
    board_rows: 8 # 标定板行数
    min_samples: 12 # 最少有效标定样本数
    square_size_m: 0.030 # 标定板方格边长（米）
    use_fisheye_model: false # 是否使用鱼眼模型
    fix_aspect_ratio: false # 是否固定 fx/fy 比例
    zero_tangent_distortion: false # 是否将切向畸变设为零
