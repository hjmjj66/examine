/**:
  ros__parameters:
    # ---------- 前相机(大恒工业相机) ----------
    enable_front_camera: true # 是否启用前相机检测
    front_image_topic: "/gx_camera/image_raw" # 前相机输入图像话题
    front_armor_topic: "/aim_detector/front/armor_sets" # 前相机装甲板输出话题
    front_visualization_topic: "/aim_detector/front/visualization" # 前相机可视化话题

    # ---------- 后相机(USB摄像头) ----------
    enable_back_camera: true # 是否启用后相机检测
    back_image_topic: "/usb_camera/image_raw" # 后相机输入图像话题
    back_armor_topic: "/aim_detector/back/armor_sets" # 后相机装甲板输出话题
    back_visualization_topic: "/aim_detector/back/visualization" # 后相机可视化话题

    # ---------- 模型与推理参数 ----------
    model_path: "/home/hustlyrm/sentry.aim/assets/0526_fp16.xml" # OpenVINO 模型文件路径
    device_name: "GPU" # 推理设备，如 CPU/GPU
    enemy_color: 1 # 敌方颜色：-2=双方，1=蓝方，0=红方
    enable_visualization: false # 是否发布检测可视化图像
    enable_pca_correction: true # 是否启用 PCA 灯条校正
    pca.pass_optimize_lightbar_width: 5 # PCA 校正通过时的灯条宽度阈值
    pca.normalize_max_brightness: 25.0 # 亮度归一化最大值
    pca.lightbar_min_mean_brightness: 35.0 # 灯条最小平均亮度
    pca.padding_scale: 0.10 # PCA 搜索区域相对外扩比例
    pca.search_start_ratio: 0.35 # 灯条采样搜索起始比例
    pca.search_end_ratio: 0.65 # 灯条采样搜索结束比例
    pca.estimated_width_ratio: 0.16 # 估计灯条宽度占 ROI 的比例
    pca.min_sample_width: 4 # PCA 最小采样宽度（像素）
