aim_predictor_node:
  ros__parameters:
    front_0_armor_pose_set_topic: "/aim_solver/front_0/armor_pose_sets"
    front_0_target_state_topic: "/aim_predictor/front_0/target_states"
    front_1_armor_pose_set_topic: "/aim_solver/front_1/armor_pose_sets"
    front_1_target_state_topic: "/aim_predictor/front_1/target_states"
    back_armor_pose_set_topic: "/aim_solver/back/armor_pose_sets"
    back_target_state_topic: "/aim_predictor/back/target_states"
    enable_visualization: true
    visualization_topic: "/aim_predictor/visualization"
    world_frame_id: "gimbal_world"
    gimbal_frame_id: "gimbal_small_yaw"
    tf_lookup_timeout_sec: 0.02
    init_radius: 0.2
    max_lost_count: 10
    middle_speed_angular_velocity_threshold: 2.0
    high_speed_angular_velocity_threshold: 4.0
    low_speed_process_noise_xy: 100.0
    low_speed_process_noise_z: 100.0
    low_speed_process_noise_yaw: 100.0
    middle_speed_process_noise_xy: 100.0
    middle_speed_process_noise_z: 100.0
    middle_speed_process_noise_yaw: 100.0
    high_speed_process_noise_xy: 100.0
    high_speed_process_noise_z: 100.0
    high_speed_process_noise_yaw: 100.0
    multi_armor_yaw_gate_deg: 40.0
    min_consecutive_detections_to_track: 10
    outpost_id: 6
