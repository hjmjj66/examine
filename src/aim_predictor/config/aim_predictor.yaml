aim_predictor_node:
  ros__parameters:
    front_0_armor_pose_set_topic: "/aim_solver/front_0/armor_pose_sets" # 前相机 0 位姿输入
    front_0_target_state_topic: "/aim_predictor/front_0/target_states" # 前相机 0 预测输出
    front_1_armor_pose_set_topic: "/aim_solver/front_1/armor_pose_sets" # 前相机 1 位姿输入
    front_1_target_state_topic: "/aim_predictor/front_1/target_states" # 前相机 1 预测输出
    back_armor_pose_set_topic: "/aim_solver/back/armor_pose_sets" # 后相机位姿输入
    back_target_state_topic: "/aim_predictor/back/target_states" # 后相机预测输出
    enable_visualization: true # 是否发布预测可视化
    visualization_topic: "/aim_predictor/visualization" # 可视化话题
    world_frame_id: "gimbal_world" # 预测使用的世界坐标系
    gimbal_frame_id: "gimbal_small_yaw" # 云台坐标系
    tf_lookup_timeout_sec: 0.02 # TF 查询超时（秒）
    init_radius: 0.2 # 新目标初始跟踪半径（米）
    max_lost_count: 10 # 连续丢失多少帧后删除目标
    middle_speed_angular_velocity_threshold: 2.0 # 中速旋转阈值（rad/s）
    high_speed_angular_velocity_threshold: 4.0 # 高速旋转阈值（rad/s）
    low_speed_process_noise_xy: 100.0 # 低速时 XY 过程噪声
    low_speed_process_noise_z: 100.0 # 低速时 Z 过程噪声
    low_speed_process_noise_yaw: 100.0 # 低速时偏航过程噪声
    middle_speed_process_noise_xy: 100.0 # 中速时 XY 过程噪声
    middle_speed_process_noise_z: 100.0 # 中速时 Z 过程噪声
    middle_speed_process_noise_yaw: 100.0 # 中速时偏航过程噪声
    high_speed_process_noise_xy: 100.0 # 高速时 XY 过程噪声
    high_speed_process_noise_z: 100.0 # 高速时 Z 过程噪声
    high_speed_process_noise_yaw: 100.0 # 高速时偏航过程噪声
    multi_armor_yaw_gate_deg: 40.0 # 多装甲板关联的偏航门限（度）
    min_consecutive_detections_to_track: 10 # 建立稳定跟踪所需连续检测次数
    outpost_id: 6 # 前哨站目标 ID
