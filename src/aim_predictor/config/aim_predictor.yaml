aim_predictor_node:
  ros__parameters:
    front_0_armor_pose_set_topic: "/aim_solver/front_0/armor_pose_sets" # 前相机 0 位姿输入
    front_1_armor_pose_set_topic: "/aim_solver/front_1/armor_pose_sets" # 前相机 1 位姿输入
    back_armor_pose_set_topic: "/aim_solver/back/armor_pose_sets" # 仅当前两路无目标时使用
    fused_target_state_topic: "/aim_predictor/fused/target_states" # 唯一的普通装甲板预测输出
    enable_visualization: true # 是否发布预测可视化
    visualization_topic: "/aim_predictor/visualization" # 可视化话题
    world_frame_id: "gimbal_world" # 预测使用的世界坐标系
    gimbal_frame_id: "gimbal_small_yaw" # 云台坐标系
    tf_lookup_timeout_sec: 0.02 # TF 查询超时（秒）
    init_radius: 0.2 # 新目标初始跟踪半径（米）
    target_lost_timeout_sec: 0.20 # 距最后一次有效观测超过该时间后删除目标
    middle_speed_angular_velocity_threshold: 2.0 # 中速旋转阈值（rad/s）
    high_speed_angular_velocity_threshold: 4.0 # 高速旋转阈值（rad/s）
    low_speed_process_noise_xy: 100.0 # 低速时 XY 过程噪声
    low_speed_process_noise_z: 100.0 # 低速时 Z 过程噪声
    low_speed_process_noise_yaw: 100.0 # 低速时偏航过程噪声
    middle_speed_process_noise_xy: 100.0 # 中速时 XY 过程噪声
    middle_speed_process_noise_z: 100.0 # 中速时 Z 过程噪声
    middle_speed_process_noise_yaw: 100.0 # 中速时偏航过程噪声
    high_speed_process_noise_xy: 100.0 # 高速时 XY 过程噪声
    high_speed_process_noise_z: 100.0 # 高速时 Z 过程噪声
    high_speed_process_noise_yaw: 100.0 # 高速时偏航过程噪声
    multi_armor_yaw_gate_deg: 40.0 # 多装甲板关联的偏航门限（度）
    min_consecutive_detections_to_track: 10 # 建立稳定跟踪所需连续检测次数
    outpost_id: 6 # 前哨站目标 ID
    confirmation_min_interval_sec: 0.03 # 两路近同时观测只计一次初始化确认，不引入等待
    front_target_hold_sec: 0.10 # 任一前相机最近有目标时，后相机不更新共享预测器

    # 三台相机的测量噪声缩放。1.0 与改造前硬编码 R 完全等价；待录包标定后单独调节。
    front_0_measurement_noise_yaw_variance_scale: 1.0 # 前相机 0 偏航测量方差缩放
    front_0_measurement_noise_pitch_variance_scale: 1.0 # 前相机 0 俯仰测量方差缩放
    front_0_measurement_noise_distance_variance_scale: 1.0 # 前相机 0 距离测量方差缩放
    front_0_measurement_noise_armor_yaw_variance_scale: 1.0 # 前相机 0 装甲板偏航方差缩放
    front_1_measurement_noise_yaw_variance_scale: 1.0 # 前相机 1 偏航测量方差缩放
    front_1_measurement_noise_pitch_variance_scale: 1.0 # 前相机 1 俯仰测量方差缩放
    front_1_measurement_noise_distance_variance_scale: 1.0 # 前相机 1 距离测量方差缩放
    front_1_measurement_noise_armor_yaw_variance_scale: 1.0 # 前相机 1 装甲板偏航方差缩放
    back_measurement_noise_yaw_variance_scale: 1.0 # 后相机偏航测量方差缩放
    back_measurement_noise_pitch_variance_scale: 1.0 # 后相机俯仰测量方差缩放
    back_measurement_noise_distance_variance_scale: 1.0 # 后相机距离测量方差缩放
    back_measurement_noise_armor_yaw_variance_scale: 1.0 # 后相机装甲板偏航方差缩放
