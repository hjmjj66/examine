aim_outpost_predictor_node:
  ros__parameters:
    armor_pose_set_topic: "/aim_solver/front_0/armor_pose_sets"
    outpost_state_topic: "/aim_outpost_predictor/outpost_state"
    enable_visualization: true
    visualization_topic: "/aim_outpost_predictor/visualization"
    world_frame_id: "gimbal_world"
    gimbal_frame_id: "gimbal_small_yaw"
    tf_lookup_timeout_sec: 0.01
    armor_gimbal_yaw_gate_deg: 40.0
    outpost_id: 6
    max_lost_count: 75
    min_consecutive_detections_to_track: 2
    max_nis_failure_ratio: 0.4
    init_radius: 0.2765
    initial_low_height_offset: -0.10
    initial_high_height_offset: 0.10
    process_noise_xy: 10.0
    process_noise_z: 10.0
    process_noise_yaw: 100.0
    angular_velocity_clamp: 2.51
    converged_min_updates: 10
    match_yaw_sigma: 0.20
    match_pitch_sigma: 0.20
    match_distance_sigma: 0.35
    match_angle_sigma: 0.35
    match_z_sigma: 0.08
    match_yaw_gate: 1.0
    match_pitch_gate: 0.9
    match_distance_gate: 2.0
    match_angle_gate: 1.0
    match_z_gate: 0.35
    reverse_direction_penalty: 2.5
    max_pair_cost: 18.0
    fast_reanchor_cost: 8.0
    fast_reanchor_frames: 2
