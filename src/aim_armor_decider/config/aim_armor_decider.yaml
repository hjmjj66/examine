aim_armor_decider_node:
  ros__parameters:
    front_0_target_states_topic: /aim_predictor/fused/target_states # 融合目标状态输入
    front_1_target_states_topic: /aim_predictor/disabled/front_1 # 保留参数兼容，不参与决策
    back_target_states_topic: /aim_predictor/disabled/back # 保留参数兼容，不参与决策
    outpost_state_topic: /aim_outpost_predictor/outpost_state # 前哨站状态输入
    armor_targets_topic: /ly/aim/armor_targets # 外部目标列表输入
    select_target_topic: /ly/aim/select_target # 外部选目标指令输入
    selected_target_id_topic: /decider/selected_target_id # 最终选中目标输出
    select_target_timeout_sec: 0.5 # 外部选目标指令有效期（秒）
    auto_select_nearest: true # true 时忽略外部选目标话题并自动选择最近目标；false 时严格执行外部目标 ID
    outpost_target_id: 6 # 前哨站目标 ID
    default_select_outpost_when_no_external_target: true # 无外部指令时是否默认选前哨站
